<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AriNova Factory Studio</title><style>body{font:16px system-ui;max-width:900px;margin:40px auto;padding:20px;color:#183047;background:#f5f7fa}section{background:white;padding:20px;margin:16px 0;border:1px solid #ccd6e0;border-radius:12px}label{display:block;margin:8px}button,input,select{font:inherit;padding:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere}button{cursor:pointer}</style><h1>AriNova Software Factory Studio</h1><p>Architecture preview only — no live execution or generated application.</p><section><label><input id="enabled" type="checkbox"> Enable factory preview</label><label>Project <input id="project" value="motor-dtc-assistant"></label><label>Model <select id="model"><option>ollama</option><option>groq</option><option>openai</option></select></label><div id="features"></div><label>Business plugin name <input id="plugin" value="motor_dtc_processor"></label><button id="preview">Preview workflow</button> <button id="export">Export manifest</button></section><section><h2>Proposed execution plan</h2><ol id="steps"></ol><pre id="manifest"></pre></section><script>const $=id=>document.getElementById(id);const caps=['rag','hybrid_search','langgraph','deep_agents','mcp','skills','evaluation','guardrails','retry','circuit_breaker','dlq','checkpointing','human_approval','observability','rbac','ci_cd'];for(const c of caps){const l=document.createElement('label'),i=document.createElement('input');i.type='checkbox';i.value=c;i.checked=c!=='deep_agents';l.append(i,' '+c);$('features').append(l)}function plan(){if(!$('enabled').checked){alert('Enable factory preview first');return}const name=$('project').value.trim(),plugin=$('plugin').value.trim();if(!/^[a-z][a-z0-9-]{0,63}$/.test(name)||!/^[a-z][a-z0-9_]{0,63}$/.test(plugin)){alert('Invalid project or plugin name');return}const capabilities=Object.fromEntries([...$('features').querySelectorAll('input')].map(i=>[i.value,i.checked]));if(capabilities.hybrid_search&&!capabilities.rag){alert('Hybrid search requires RAG');return}if(capabilities.dlq&&!capabilities.retry){alert('DLQ requires retry in this pilot');return}const m={project:name,model:$('model').value,business_plugin:plugin,capabilities,mode:'preview'};$('manifest').textContent=JSON.stringify(m,null,2);$('steps').replaceChildren();for(const s of ['Validate manifest','Resolve selected SDK components','Scaffold application (planned)','Attach business plugin (planned)',...caps.filter(c=>capabilities[c]).map(c=>'Configure '+c),'Run quality gates (planned)','Human release approval (planned)','Deploy and monitor (planned)']){const li=document.createElement('li');li.textContent=s;$('steps').append(li)}return m}$('preview').onclick=plan;$('export').onclick=()=>{const m=plan();if(!m)return;const url=URL.createObjectURL(new Blob([JSON.stringify(m,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=m.project+'.json';a.click();URL.revokeObjectURL(url)};</script></html>
