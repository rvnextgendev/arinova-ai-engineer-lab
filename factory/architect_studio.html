<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AriNova Architect Labs</title><style>body{margin:0;background:#f1f5f9;color:#172337;font:16px system-ui}header{background:#14243d;color:white;padding:24px}header a{color:white}main{max-width:1100px;margin:auto;padding:20px;display:grid;grid-template-columns:250px 1fr;gap:20px}nav,article{background:white;padding:20px;border-radius:12px}button,textarea{font:inherit;box-sizing:border-box;width:100%;padding:12px;margin:5px 0;border:1px solid #bac7d5;border-radius:7px}button{cursor:pointer;background:#e7eef8;color:#172337}button.active,#run{background:#2257a5;color:white}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f1f5f9;padding:14px}small{color:#52647b}@media(max-width:700px){main{grid-template-columns:1fr}}</style><header><h1>AriNova Architect Labs</h1><a href="/">Return to Policy Studio</a></header><main><nav id="nav"></nav><article><h2 id="title"></h2><p id="description"></p><label for="input">Exercise input (fictional data only)</label><textarea id="input" rows="4">What is the VPN policy?</textarea><button id="run">Execute exercise</button><p id="status" role="status"></p><pre id="result"></pre><h3>Next integration targets</h3><p id="next"></p></article></main><script>
const modules=[['validation','Testing & Validation','Check actual Ollama and PostgreSQL connectivity and pgvector extension.','End-to-end test suites, delivery gates, GitHub PR'],['llmops','LLMOps','Execute local model and measure latency and token counts.','LiteLLM, Langfuse, Valkey, Promptfoo, OpenTelemetry'],['security','Security & Governance','Demonstrate regex masking and injection indicators. Not an enforcement layer.','Keycloak, RLS, OPA, Presidio, Trivy, audit'],['agents','Advanced Agents','Execute a two-node LangGraph context selection exercise on fictional snippets.','Memory, A2A, Temporal, checkpointing, delegation'],['knowledge','Knowledge & Models','Compare actual Ollama embeddings and cosine similarity.','GraphRAG, OCR, multimodal, quantization, LoRA'],['deployment','Deployment & Recovery','Execute a temporary SQLite backup and restore exercise.','Compose, Kubernetes, OpenTofu, Locust, PostgreSQL recovery']];
const $=id=>document.getElementById(id);let selected=0;
function select(i){selected=i;let m=modules[i];$('title').textContent=m[1];$('description').textContent=m[2];$('next').textContent=m[3];$('result').textContent='';$('status').textContent='';Array.from($('nav').children).forEach((b,j)=>b.className=i===j?'active':'')}
modules.forEach((m,i)=>{let b=document.createElement('button');b.textContent=(i+1)+' / '+m[1];b.onclick=()=>select(i);$('nav').append(b)});select(0);
$('run').onclick=async()=>{let i=selected;$('run').disabled=true;Array.from($('nav').children).forEach(b=>b.disabled=true);$('status').textContent='Running…';try{let r=await fetch('/architect/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({module:modules[i][0],text:$('input').value})});let data=await r.json();$('result').textContent=JSON.stringify(data,null,2);$('status').textContent=r.ok?'Completed':'Failed'}catch(e){$('status').textContent=e.message}finally{$('run').disabled=false;Array.from($('nav').children).forEach(b=>b.disabled=false)}};
</script></html>
