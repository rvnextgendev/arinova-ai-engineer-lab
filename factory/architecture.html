<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AriNova architecture preview</title><style>body{font:16px system-ui;background:#f5f7fa;color:#183047;max-width:1000px;margin:32px auto;padding:16px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}article,section{background:white;border:1px solid #ccd6e0;border-radius:10px;padding:16px;margin-bottom:12px}input,select,button{font:inherit;padding:8px;max-width:100%}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style><h1>AriNova Architecture Studio</h1><p>Offline pilot and planned integrations. No external AI calls.</p><main id="catalog"></main><section><h2>Core workflow pilot</h2><input id="question" value="Explain P0302"><select id="scenario"><option value="normal">Normal</option><option value="failure">Injected failure</option><option value="quality">Injected quality failure</option></select><button id="run">Execute local pilot</button><pre id="result"></pre></section><script>const $=id=>document.getElementById(id);fetch('/catalog').then(r=>r.json()).then(items=>{for(const item of items){const a=document.createElement('article');for(const [tag,value] of [['h3',item.name],['strong',item.status],['p',item.scope]]){const el=document.createElement(tag);el.textContent=value;a.append(el)}$('catalog').append(a)}}).catch(e=>$('catalog').textContent=String(e));$('run').onclick=async()=>{try{const r=await fetch('/execute',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:$('question').value,scenario:$('scenario').value})});$('result').textContent=JSON.stringify(await r.json(),null,2)}catch(e){$('result').textContent=String(e)}};</script></html>
